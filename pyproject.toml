[project]
name = "fleur"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "altescy", email = "me@altescy.jp" }
]
requires-python = ">=3.11"
dependencies = ["typing-extensions>=4.15"]

[project.scripts]
fleur = "fleur.__main__:run"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "ruff>=0.15.6",
]

[tool.pyright]
pythonVersion = "3.11"

[tool.ruff]
line-length = 120
