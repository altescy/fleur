[project]
name = "fleur"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pyright>=1.1.398",
    "pytest>=8.3.5",
    "ruff>=0.11.4",
]

[build-system]
requires = ['hatchling', 'hatch-fancy-pypi-readme>=22.5.0']
build-backend = 'hatchling.build'

[tool.ruff]
line-length = 120

[tool.hatch.version]
path = 'fleur/__init__.py'

[tool.hatch.metadata]
allow-direct-references = true
