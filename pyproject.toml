[project]
name = "fleur"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "altescy", email = "me@altescy.jp" }
]
requires-python = ">=3.9"
dependencies = [
    "typing-extensions>=4.15.0",
]

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.407",
    "pytest>=8.4.2",
    "ruff>=0.14.2",
]

[tool.pyright]
pythonVersion = "3.9"

[tool.ruff]
line-length = 120
