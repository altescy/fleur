name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: astral-sh/setup-uv@v8.3.2
      - run: uv sync
      - run: uv run ruff check src tests
        env:
          PYTHONPATH: ${{ github.workspace }}

  python-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: astral-sh/setup-uv@v8.3.2
      - run: uv sync
      - run: uv run pyright
        env:
          PYTHONPATH: ${{ github.workspace }}

  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: astral-sh/setup-uv@v8.3.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: uv sync
      - name: Install Playwright and Chromium
        env:
          NODE_PATH: ${{ runner.temp }}/fleur-browser/node_modules
        run: |
          npm install --prefix "$RUNNER_TEMP/fleur-browser" --no-save --no-package-lock playwright-core@1.65.1
          node "$NODE_PATH/playwright-core/cli.js" install --with-deps --no-shell chromium
          browser="$(node -p 'require("playwright-core").chromium.executablePath()')"
          test -x "$browser"
          echo "FLEUR_TEST_CHROMIUM=$browser" >> "$GITHUB_ENV"
      - run: uv run pytest -q
        env:
          PYTHONPATH: ${{ github.workspace }}
          NODE_PATH: ${{ runner.temp }}/fleur-browser/node_modules
          FLEUR_REQUIRE_BROWSER_TESTS: '1'

  runtime-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: oven-sh/setup-bun@v2.2.0
      - run: bun install --cwd runtime
      - run: bun run --cwd runtime check

  runtime-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: oven-sh/setup-bun@v2.2.0
      - run: bun install --cwd runtime
      - run: bun run --cwd runtime test

