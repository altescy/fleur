name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: astral-sh/setup-uv@v8.3.2
      - run: uv sync
      - run: uv run ruff check src tests
        env:
          PYTHONPATH: ${{ github.workspace }}

  python-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: astral-sh/setup-uv@v8.3.2
      - run: uv sync
      - run: uv run pyright
        env:
          PYTHONPATH: ${{ github.workspace }}

  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: astral-sh/setup-uv@v8.3.2
      - run: uv sync
      - run: uv run pytest -q
        env:
          PYTHONPATH: ${{ github.workspace }}

  runtime-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: oven-sh/setup-bun@v2.2.0
      - run: bun install --cwd runtime
      - run: bun run --cwd runtime check

  runtime-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: oven-sh/setup-bun@v2.2.0
      - run: bun install --cwd runtime
      - run: bun run --cwd runtime test

