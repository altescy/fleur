name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv sync
      - run: uv run ruff check src tests
        env:
          PYTHONPATH: ${{ github.workspace }}

  python-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv sync
      - run: uv run pyright
        env:
          PYTHONPATH: ${{ github.workspace }}
      - name: Keep the public API fully typed
        run: uv run pyright --verifytypes fleur --ignoreexternal
        env:
          PYTHONPATH: ${{ github.workspace }}

  python-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.4.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
      - run: uv sync --locked
      - name: Install Playwright, Chromium, and WebKit
        env:
          NODE_PATH: ${{ runner.temp }}/fleur-browser/node_modules
        run: |
          npm install --prefix "$RUNNER_TEMP/fleur-browser" --no-save --no-package-lock playwright-core@1.65.1
          node "$NODE_PATH/playwright-core/cli.js" install --with-deps --no-shell chromium webkit
          browser="$(node -p 'require("playwright-core").chromium.executablePath()')"
          test -x "$browser"
          echo "FLEUR_TEST_CHROMIUM=$browser" >> "$GITHUB_ENV"
      - run: uv run --locked pytest -q
        env:
          PYTHONPATH: ${{ github.workspace }}
          NODE_PATH: ${{ runner.temp }}/fleur-browser/node_modules
          FLEUR_REQUIRE_BROWSER_TESTS: '1'

  python-wheel:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: '3.11'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv build --wheel
      - name: Render a page from the installed wheel
        run: |
          uv venv "$RUNNER_TEMP/install"
          installed_python="$RUNNER_TEMP/install/bin/python"
          uv pip install --python "$installed_python" dist/*.whl
          "$installed_python" -I - "$GITHUB_WORKSPACE/examples/counter.py" <<'PY'
          import runpy
          import sys

          from fleur import bloom

          html = bloom(runpy.run_path(sys.argv[1])["app"])
          assert "<style>" in html and "<script>" in html and "Count: " in html
          PY

  runtime-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
      - run: bun install --cwd runtime
      - run: bun run --cwd runtime check

  runtime-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
      - run: bun install --cwd runtime
      - run: bun run --cwd runtime test

